name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

env:
  TF_DIR: envs/prototype

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"

      - name: Format
        run: terraform fmt -check -recursive

      - name: Init (no backend)
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -backend=false

      - name: Validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate

      - uses: terraform-linters/setup-tflint@v4

      - name: tflint
        run: |
          tflint --init
          tflint --recursive

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          quiet: true

  cost:
    # Estimates monthly cost from the Terraform code alone; nothing is deployed.
    # Needs an INFRACOST_API_KEY repository secret (free key from infracost.io).
    if: ${{ github.event_name == 'pull_request' && vars.INFRACOST_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Estimate
        run: infracost breakdown --path ${{ env.TF_DIR }} --format table
